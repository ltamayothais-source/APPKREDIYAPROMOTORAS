<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrediYA - Gestión de Promotoras</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        krediya: {
                            blue: '#0052CC',
                            darkBlue: '#003996',
                            red: '#FF0055',
                            accentRed: '#E6004C',
                            bgGray: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #E2E8F0;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

    <!-- Header Principal con Logo Oficial Panamá KrediYA -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Logotipo SVG KrediYA Panamá -->
            <div class="flex items-center space-x-2">
                <svg class="h-9 w-auto" viewBox="0 0 180 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <text x="5" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#0052CC">Panamá</text>
                    <text x="5" y="58" font-family="'Inter', sans-serif" font-weight="800" font-size="38" fill="#0052CC">Kredi</text>
                    <text x="110" y="58" font-family="'Inter', sans-serif" font-weight="800" font-size="38" fill="#FF0055">YA</text>
                </svg>
            </div>
            
            <div class="text-right">
                <span class="text-[10px] font-bold text-slate-400 tracking-wider uppercase block">Gestión Promotoras</span>
                <span class="text-xs font-bold text-krediya-blue">Seguimiento de Clientes</span>
            </div>
        </div>
    </header>

    <!-- Contenedor Aplicación Mobile-First -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- Barra de Acción y Exportación -->
        <div class="flex items-center justify-between gap-2">
            <button onclick="openModal()" class="flex-1 bg-krediya-red hover:bg-krediya-accentRed text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-red-200 flex items-center justify-center space-x-2 transition active:scale-95">
                <i class="fa-solid fa-user-plus text-sm"></i>
                <span>Nuevo Cliente</span>
            </button>
            
            <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-emerald-100 flex items-center justify-center space-x-2 transition active:scale-95">
                <i class="fa-solid fa-file-excel text-base"></i>
                <span class="text-xs">Exportar CSV</span>
            </button>
        </div>

        <!-- Filtros de Zonas y Estado -->
        <div class="glass-card rounded-2xl p-4 space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">
                        <i class="fa-solid fa-location-dot text-krediya-red mr-1"></i>Zona
                    </label>
                    <select id="filterZone" onchange="filterLeads()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold text-slate-700 focus:outline-none focus:border-krediya-blue">
                        <option value="TODAS">TODAS LAS ZONAS</option>
                        <option value="CHITRE">CHITRÉ</option>
                        <option value="SANTIAGO">SANTIAGO</option>
                        <option value="CHIRIQUI">CHIRIQUÍ</option>
                        <option value="PENONOME">PENONOMÉ</option>
                        <option value="OESTE">PANAMÁ OESTE</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">
                        <i class="fa-solid fa-filter text-krediya-blue mr-1"></i>Estado Crédito
                    </label>
                    <select id="filterStatus" onchange="filterLeads()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold text-slate-700 focus:outline-none focus:border-krediya-blue">
                        <option value="TODOS">TODOS LOS ESTADOS</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Requiere Inicial">Requiere Inicial</option>
                        <option value="Aprobado">Aprobado</option>
                        <option value="Rechazado">Rechazado</option>
                    </select>
                </div>
            </div>

            <!-- Búsqueda por texto -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="filterLeads()" placeholder="Buscar por cliente, cédula, tienda o promotora..." class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-3 py-2 text-xs font-medium text-slate-700 focus:outline-none focus:border-krediya-blue">
            </div>
        </div>

        <!-- Dashboard / Métricas Rápidas -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-white border border-slate-200 rounded-xl p-3 text-center shadow-sm">
                <span id="metricTotal" class="block text-xl font-black text-slate-800">0</span>
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Total Leads</span>
            </div>
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center shadow-sm">
                <span id="metricPending" class="block text-xl font-black text-amber-600">0</span>
                <span class="text-[9px] font-bold text-amber-600 uppercase tracking-wider">Pendientes</span>
            </div>
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center shadow-sm">
                <span id="metricApproved" class="block text-xl font-black text-emerald-600">0</span>
                <span class="text-[9px] font-bold text-emerald-600 uppercase tracking-wider">Aprobados</span>
            </div>
        </div>

        <!-- Lista de Prospectos Capturados -->
        <div class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-users text-krediya-blue"></i> Prospectos Capturados
                </h2>
                <span id="leadCountBadge" class="text-[10px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">0</span>
            </div>

            <div id="leadsList" class="space-y-3">
                <!-- Tarjetas dinámicas generadas por JS -->
            </div>
        </div>

    </main>

    <!-- Modal Formulario Agregar / Editar Cliente -->
    <div id="leadModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-krediya-blue p-4 text-white flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Capturar Nuevo Prospecto
                </h3>
                <button onclick="closeModal()" class="text-white/80 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="leadForm" onsubmit="saveLead(event)" class="p-4 space-y-3">
                <input type="hidden" id="leadId">

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Promotora *</label>
                        <input type="text" id="promoterName" required placeholder="Nombre Promotora" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Tienda / Comercio *</label>
                        <input type="text" id="storeName" required placeholder="Ej. Innovatek, Panda..." class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Zona *</label>
                        <select id="zone" required class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none">
                            <option value="CHITRE">CHITRÉ</option>
                            <option value="SANTIAGO">SANTIAGO</option>
                            <option value="CHIRIQUI">CHIRIQUÍ</option>
                            <option value="PENONOME">PENONOMÉ</option>
                            <option value="OESTE">PANAMÁ OESTE</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Producto Interés</label>
                        <select id="productInterest" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none">
                            <option value="Smartphone / Celular">Smartphone / Celular</option>
                            <option value="Moto / Movilidad">Moto / Movilidad</option>
                            <option value="Electródoméstico / TV">Electródoméstico / TV</option>
                            <option value="Préstamo Efectivo">Préstamo Efectivo</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Nombre Completo Cliente *</label>
                    <input type="text" id="clientName" required placeholder="Ej. Juan Pérez" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Cédula *</label>
                        <input type="text" id="clientCedula" required placeholder="8-888-8888" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Teléfono / WhatsApp *</label>
                        <input type="tel" id="clientPhone" required placeholder="60000000" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Estado Crédito</label>
                    <select id="creditStatus" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none">
                        <option value="Pendiente">Pendiente</option>
                        <option value="Requiere Inicial">Requiere Inicial</option>
                        <option value="Aprobado">Aprobado</option>
                        <option value="Rechazado">Rechazado</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-600 uppercase mb-1">Notas / Observaciones</label>
                    <textarea id="notes" rows="2" placeholder="Detalles de la gestión..." class="w-full border border-slate-300 rounded-lg p-2 text-xs font-medium focus:border-krediya-blue focus:outline-none"></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-krediya-blue hover:bg-krediya-darkBlue text-white font-bold py-2.5 rounded-xl text-xs shadow-md shadow-blue-200">Guardar Lead</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast de Notificaciones -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-xl shadow-xl hidden z-50"></div>

    <script>
        // Datos Iniciales de Demostración
        const initialLeads = [
            {
                id: "101",
                promoterName: "Ana López",
                storeName: "Innovatek",
                zone: "CHITRE",
                clientName: "Juan Pérez",
                clientCedula: "6-701-1234",
                clientPhone: "65551234",
                productInterest: "Smartphone / Celular",
                creditStatus: "Pendiente",
                notes: "Pendiente enviarme foto de la cédula por WhatsApp.",
                createdAt: "2026-11-08"
            },
            {
                id: "102",
                promoterName: "Laura Martínez",
                storeName: "Panda Phone",
                zone: "SANTIAGO",
                clientName: "Ariel Santamaría",
                clientCedula: "9-720-4567",
                clientPhone: "67778899",
                productInterest: "Moto / Movilidad",
                creditStatus: "Requiere Inicial",
                notes: "Le faltan $50 para completar la inicial.",
                createdAt: "2026-11-09"
            },
            {
                id: "103",
                promoterName: "María Rodríguez",
                storeName: "Sucursal Central",
                zone: "CHIRIQUI",
                clientName: "Elena Ríos",
                clientCedula: "4-750-9876",
                clientPhone: "62223344",
                productInterest: "Electródoméstico / TV",
                creditStatus: "Aprobado",
                notes: "Aprobado listo para retiro de equipo.",
                createdAt: "2026-11-10"
            }
        ];

        let leads = [];

        document.addEventListener('DOMContentLoaded', () => {
            const stored = localStorage.getItem('krediya_leads_db_v2');
            if (stored) {
                leads = JSON.parse(stored);
            } else {
                leads = initialLeads;
                saveToLocalStorage();
            }
            renderLeads();
        });

        function saveToLocalStorage() {
            localStorage.setItem('krediya_leads_db_v2', JSON.stringify(leads));
        }

        function renderLeads(filteredData = null) {
            const listContainer = document.getElementById('leadsList');
            const data = filteredData || leads;
            
            listContainer.innerHTML = '';
            document.getElementById('leadCountBadge').innerText = data.length;

            updateMetrics();

            if (data.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-white border border-slate-200 rounded-xl p-8 text-center text-slate-400">
                        <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i>
                        <p class="text-xs font-semibold">No se encontraron prospectos registrados</p>
                    </div>
                `;
                return;
            }

            data.forEach(lead => {
                let badgeColor = "bg-amber-100 text-amber-800 border-amber-200";
                if (lead.creditStatus === 'Aprobado') badgeColor = "bg-emerald-100 text-emerald-800 border-emerald-200";
                if (lead.creditStatus === 'Requiere Inicial') badgeColor = "bg-blue-100 text-blue-800 border-blue-200";
                if (lead.creditStatus === 'Rechazado') badgeColor = "bg-rose-100 text-rose-800 border-rose-200";

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-3.5 shadow-sm space-y-2 relative";
                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[10px] font-bold text-krediya-blue bg-blue-50 px-2 py-0.5 rounded-md">
                                ${lead.zone}
                            </span>
                            <span class="text-[10px] font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md">
                                <i class="fa-solid fa-store text-slate-400 mr-1"></i>${lead.storeName || 'N/A'}
                            </span>
                        </div>
                        <span class="text-[10px] font-bold border px-2 py-0.5 rounded-md ${badgeColor}">
                            ${lead.creditStatus}
                        </span>
                    </div>

                    <div class="pt-1">
                        <h3 class="font-bold text-slate-800 text-sm">${lead.clientName}</h3>
                        <p class="text-xs text-slate-500">Cédula: ${lead.clientCedula}</p>
                        <p class="text-xs font-semibold text-slate-600 mt-1">
                            <i class="fa-solid fa-box text-slate-400 mr-1"></i>${lead.productInterest}
                        </p>
                        ${lead.notes ? `<p class="text-xs text-slate-500 italic mt-1 bg-slate-50 p-2 rounded-lg border border-slate-100 font-normal">"${lead.notes}"</p>` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-2 text-[10px] text-slate-400 border-t border-slate-100">
                        <span><i class="fa-solid fa-user-tag mr-1"></i>${lead.promoterName}</span>
                        <span>${lead.createdAt}</span>
                    </div>

                    <div class="flex items-center gap-1 pt-1">
                        <a href="https://wa.me/507${lead.clientPhone.replace(/\D/g,'')}" target="_blank" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white text-[11px] font-bold py-1.5 rounded-lg text-center flex items-center justify-center gap-1">
                            <i class="fa-brands fa-whatsapp text-xs"></i> WhatsApp
                        </a>
                        <button onclick="editLead('${lead.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-[11px] font-bold">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteLead('${lead.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-[11px] font-bold">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function updateMetrics() {
            document.getElementById('metricTotal').innerText = leads.length;
            document.getElementById('metricPending').innerText = leads.filter(l => l.creditStatus === 'Pendiente').length;
            document.getElementById('metricApproved').innerText = leads.filter(l => l.creditStatus === 'Aprobado').length;
        }

        function filterLeads() {
            const zone = document.getElementById('filterZone').value;
            const status = document.getElementById('filterStatus').value;
            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = leads.filter(l => {
                const matchZone = (zone === 'TODAS' || l.zone === zone);
                const matchStatus = (status === 'TODOS' || l.creditStatus === status);
                const matchQuery = l.clientName.toLowerCase().includes(query) || 
                                   l.clientCedula.toLowerCase().includes(query) || 
                                   l.promoterName.toLowerCase().includes(query) ||
                                   (l.storeName && l.storeName.toLowerCase().includes(query));
                return matchZone && matchStatus && matchQuery;
            });

            renderLeads(filtered);
        }

        function openModal(isEdit = false) {
            document.getElementById('leadModal').classList.remove('hidden');
            if (!isEdit) {
                document.getElementById('modalTitle').innerText = 'Capturar Nuevo Prospecto';
                document.getElementById('leadForm').reset();
                document.getElementById('leadId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('leadModal').classList.add('hidden');
        }

        function saveLead(e) {
            e.preventDefault();
            const id = document.getElementById('leadId').value;
            const newLead = {
                id: id || Date.now().toString(),
                promoterName: document.getElementById('promoterName').value,
                storeName: document.getElementById('storeName').value,
                zone: document.getElementById('zone').value,
                clientName: document.getElementById('clientName').value,
                clientCedula: document.getElementById('clientCedula').value,
                clientPhone: document.getElementById('clientPhone').value,
                productInterest: document.getElementById('productInterest').value,
                creditStatus: document.getElementById('creditStatus').value,
                notes: document.getElementById('notes').value,
                createdAt: id ? leads.find(l => l.id === id).createdAt : new Date().toISOString().slice(0, 10)
            };

            if (id) {
                const index = leads.findIndex(l => l.id === id);
                leads[index] = newLead;
                showToast('Lead actualizado correctamente');
            } else {
                leads.unshift(newLead);
                showToast('Nuevo lead registrado');
            }

            saveToLocalStorage();
            renderLeads();
            closeModal();
        }

        function editLead(id) {
            const lead = leads.find(l => l.id === id);
            if (!lead) return;

            document.getElementById('modalTitle').innerText = 'Editar Prospecto';
            document.getElementById('leadId').value = lead.id;
            document.getElementById('promoterName').value = lead.promoterName;
            document.getElementById('storeName').value = lead.storeName || '';
            document.getElementById('zone').value = lead.zone;
            document.getElementById('clientName').value = lead.clientName;
            document.getElementById('clientCedula').value = lead.clientCedula;
            document.getElementById('clientPhone').value = lead.clientPhone;
            document.getElementById('productInterest').value = lead.productInterest;
            document.getElementById('creditStatus').value = lead.creditStatus;
            document.getElementById('notes').value = lead.notes;

            openModal(true);
        }

        function deleteLead(id) {
            if (confirm('¿Deseas eliminar este cliente de la lista?')) {
                leads = leads.filter(l => l.id !== id);
                saveToLocalStorage();
                renderLeads();
                showToast('Cliente eliminado');
            }
        }

        // --- EXPORTACIÓN A CSV PARA EXCEL AUTOMÁTICO ---
        function exportToCSV() {
            if (leads.length === 0) {
                showToast('No hay datos para exportar', 'warning');
                return;
            }

            let csvContent = "\uFEFFsep=,\n";
            const headers = ["ID", "Promotora", "Tienda", "Zona", "Cliente", "Cédula", "Teléfono", "Producto", "Estado Crédito", "Notas", "Fecha Registro"];
            csvContent += headers.join(",") + "\n";

            leads.forEach(l => {
                const row = [
                    l.id,
                    `"${(l.promoterName || '').replace(/"/g, '""')}"`,
                    `"${(l.storeName || '').replace(/"/g, '""')}"`,
                    `"${l.zone}"`,
                    `"${(l.clientName || '').replace(/"/g, '""')}"`,
                    `"${l.clientCedula}"`,
                    `"${l.clientPhone}"`,
                    `"${l.productInterest}"`,
                    `"${l.creditStatus}"`,
                    `"${(l.notes || '').replace(/"/g, '""')}"`,
                    `"${l.createdAt || ''}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Leads_KrediYA_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Base de datos exportada para Excel');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
